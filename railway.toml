[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
dockerBuildArgs = [
  "NEXT_PUBLIC_AGG_APP_ID",
  "NEXT_PUBLIC_AGG_API_KEY",
  "NEXT_PUBLIC_AGG_BASE_URL",
  "NEXT_PUBLIC_AGG_WS_URL",
  "NEXT_PUBLIC_AGG_AUTH_REDIRECT",
  "NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID",
  "NEXT_PUBLIC_SITE_URL",
  # Per-commit value — busts the Docker `npm run build` cache layer so new
  # source is actually recompiled each deploy (see Dockerfile note).
  "RAILWAY_GIT_COMMIT_SHA",
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
